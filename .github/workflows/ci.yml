name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  crucible-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crucible

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate content
        run: cargo run --locked -q -p crucible-cli -- validate --content ./content

      - name: Determinism and replay
        run: |
          cargo run --locked -q -p crucible-cli -- run --seed 42 --content ./content --out /tmp/a.json > /dev/null
          cargo run --locked -q -p crucible-cli -- run --seed 42 --content ./content --out /tmp/b.json > /dev/null
          cmp /tmp/a.json /tmp/b.json
          cargo run --locked -q -p crucible-cli -- replay /tmp/a.json

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.14.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @crucible/shared build

      - name: Generate Prisma client
        run: pnpm --filter @crucible/server db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build all
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t crucible-server:test .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t crucible-web:test .
