name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  crucible-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crucible

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate content
        run: cargo run --locked -q -p crucible-cli -- validate --content ./content

      - name: Determinism and replay
        run: |
          cargo run --locked -q -p crucible-cli -- run --seed 42 --content ./content --out /tmp/a.json > /dev/null
          cargo run --locked -q -p crucible-cli -- run --seed 42 --content ./content --out /tmp/b.json > /dev/null
          cmp /tmp/a.json /tmp/b.json
          cargo run --locked -q -p crucible-cli -- replay /tmp/a.json

      - name: Browser board builds
        run: |
          cargo build --locked -q -p crucible-wasm --target wasm32-unknown-unknown --release
          node board/build.mjs nursing-60 /tmp/board.html
