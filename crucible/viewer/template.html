<title>Crucible Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e9ecef; --bg-2:#dfe3e8; --panel:#f6f7f9; --panel-2:#eceef1; --line:#c9cfd6; --line-2:#b3bbc4;
  --fg:#15202b; --fg-2:#45515d; --fg-3:#6f7b87;
  --accent:#1b6e9c; --accent-soft:rgba(27,110,156,.14); --accent-fg:#ffffff;
  --ok:#2f8a5b; --ok-soft:rgba(47,138,91,.16);
  --caution:#9a8a1c; --caution-soft:rgba(154,138,28,.18);
  --degraded:#c26f12; --degraded-soft:rgba(194,111,18,.18);
  --critical:#c23b2c; --critical-soft:rgba(194,59,44,.16);
  --failed:#7d1f2e; --failed-soft:rgba(125,31,46,.16);
  --na:#aab2ba;
  --sea:#d3dde6; --sea-2:#c2cfdb; --land:#e4e3d8; --land-2:#d6d5c6; --road:#5b6670;
  --storm:#4f3a86; --storm-soft:rgba(79,58,134,.12);
  --neg:#b2372a; --pos:#2a7f58;
  --shadow:0 1px 0 rgba(0,0,0,.06);
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --bg-2:#0d1115; --panel:#1a2026; --panel-2:#20272e; --line:#2d363f; --line-2:#3b4650;
    --fg:#e3e8ec; --fg-2:#aab4bd; --fg-3:#7d8893;
    --accent:#5aa9d6; --accent-soft:rgba(90,169,214,.16); --accent-fg:#0b1218;
    --ok:#4fb97e; --ok-soft:rgba(79,185,126,.18);
    --caution:#cdb84a; --caution-soft:rgba(205,184,74,.18);
    --degraded:#e39343; --degraded-soft:rgba(227,147,67,.18);
    --critical:#ea6454; --critical-soft:rgba(234,100,84,.18);
    --failed:#b8475a; --failed-soft:rgba(184,71,90,.2);
    --na:#4a545e;
    --sea:#182129; --sea-2:#1d2a34; --land:#2a3038; --land-2:#343b44; --road:#aab4bd;
    --storm:#b7a6ea; --storm-soft:rgba(183,166,234,.14);
    --neg:#ef7a6a; --pos:#5cc48c;
    --shadow:0 1px 0 rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --bg-2:#0d1115; --panel:#1a2026; --panel-2:#20272e; --line:#2d363f; --line-2:#3b4650;
  --fg:#e3e8ec; --fg-2:#aab4bd; --fg-3:#7d8893;
  --accent:#5aa9d6; --accent-soft:rgba(90,169,214,.16); --accent-fg:#0b1218;
  --ok:#4fb97e; --ok-soft:rgba(79,185,126,.18);
  --caution:#cdb84a; --caution-soft:rgba(205,184,74,.18);
  --degraded:#e39343; --degraded-soft:rgba(227,147,67,.18);
  --critical:#ea6454; --critical-soft:rgba(234,100,84,.18);
  --failed:#b8475a; --failed-soft:rgba(184,71,90,.2);
  --na:#4a545e;
  --sea:#182129; --sea-2:#1d2a34; --land:#2a3038; --land-2:#343b44; --road:#aab4bd;
  --storm:#b7a6ea; --storm-soft:rgba(183,166,234,.14);
  --neg:#ef7a6a; --pos:#5cc48c;
  --shadow:0 1px 0 rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,.pnode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pnode:focus-visible{outline:none}
.pnode:focus-visible .node-ring{stroke:var(--accent);stroke-width:1.2}
h1,h2,h3{margin:0;font-weight:600}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}

/* header band */
.band{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:stretch;justify-content:space-between;border-top:3px solid var(--accent);border-bottom:1px solid var(--line);padding:12px 0 12px;margin-bottom:12px}
.band-id{min-width:0;flex:1 1 320px}
.band-id h1{font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.band-id h1 small{font-weight:500;color:var(--fg-2);font-size:14px;letter-spacing:.04em;margin-left:10px;text-transform:none}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.meta span b{color:var(--fg);font-weight:500}
.meta .k{color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-right:5px}
.clockbox{flex:0 1 auto;min-width:0;display:flex;gap:18px;align-items:center;border-left:1px solid var(--line);padding-left:18px}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:40px;font-weight:600;letter-spacing:.02em;line-height:1;color:var(--fg)}
.clock .pre{font-size:18px;color:var(--fg-3);margin-right:4px;font-weight:500}
.clock-sub{display:flex;flex-direction:column;gap:4px;min-width:0}
.clock-sub .win{font-size:15px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.clock-sub .winid{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line-2);border-radius:2px;color:var(--fg-2);white-space:nowrap;line-height:1.4}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-3)}
.chip.watch{border-color:var(--caution);color:var(--caution)}.chip.watch::before{background:var(--caution)}
.chip.crisis{border-color:var(--critical);color:var(--critical)}.chip.crisis::before{background:var(--critical)}
.chip.recovery{border-color:var(--ok);color:var(--ok)}.chip.recovery::before{background:var(--ok)}
@media (max-width:720px){.clockbox{border-left:0;padding-left:0;width:100%}.clock{font-size:32px}}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.panel-h h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--fg-2)}
.panel-h .sub{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.panel-b{padding:12px}

/* time control */
.timectl{margin-bottom:12px}
.tc-grid{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:start}
@media (max-width:820px){.tc-grid{grid-template-columns:1fr}}
.dstrip{position:relative;height:22px;border:1px solid var(--line);background:var(--bg-2);margin-bottom:6px;cursor:pointer;overflow:hidden}
.dstrip .lf{position:absolute;top:0;bottom:0;width:1px;background:var(--fg-3)}
.dstrip .lf::after{content:"LF";position:absolute;top:1px;left:3px;font:10px var(--mono);color:var(--fg-3);letter-spacing:.08em}
.dstrip .dm{position:absolute;top:3px;bottom:3px;width:3px;margin-left:-1px;border-radius:1px}
.dstrip .dm.pos{background:var(--pos)}.dstrip .dm.neg{background:var(--neg)}.dstrip .dm.zero{background:var(--fg-3)}
.dstrip .ph{position:absolute;top:0;bottom:0}
.dstrip .ph.crisis{background:var(--critical-soft)}.dstrip .ph.recovery{background:var(--ok-soft)}.dstrip .ph.watch{background:var(--caution-soft)}
.dstrip .cur{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent)}
.dlegend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--fg-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.dlegend i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:-1px}
.dlegend i.pos{background:var(--pos)}.dlegend i.neg{background:var(--neg)}.dlegend i.zero{background:var(--fg-3)}
.scrub{display:flex;align-items:center;gap:10px}
.scrub input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--accent);height:28px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 10px;border:1px solid var(--line-2);background:var(--panel);color:var(--fg);cursor:pointer;border-radius:2px;font-weight:600;font-size:13px;letter-spacing:.04em}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);min-width:76px}
.btn svg{width:12px;height:12px;fill:currentColor}
.tc-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.tc-row .ticklbl b{color:var(--fg);font-weight:500}
.imeter{min-width:0}
.imeter .segs{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:240px;max-width:100%;margin-top:6px}
.imeter .seg{height:18px;background:var(--bg-2);border:1px solid var(--line);position:relative}
.imeter .seg.on{background:var(--fg-3);border-color:var(--fg-3)}
.imeter .seg.on.lv-hi{background:var(--critical);border-color:var(--critical)}
.imeter .seg.on.lv-mid{background:var(--degraded);border-color:var(--degraded)}
.imeter .seg.on.lv-lo{background:var(--caution);border-color:var(--caution)}
.imeter .segnums{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:240px;max-width:100%;font-family:var(--mono);font-size:9.5px;color:var(--fg-3);text-align:center;margin-top:2px}
.imeter .ival{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1}
.imeter .ival small{font-size:11px;color:var(--fg-3);font-weight:400;margin-left:4px}
.wx{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--fg-2);margin-top:8px}
.wx b{color:var(--fg);font-weight:500}

/* main grid: map + feed */
.main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:12px;margin-bottom:12px}
@media (max-width:980px){.main{grid-template-columns:1fr}}
.mapwrap{position:relative;background:var(--sea);aspect-ratio:17/11;max-width:100%}
.mapwrap svg{display:block;width:100%;height:100%;max-width:100%}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.map-legend i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:-1px}
.map-legend i.ok{background:var(--ok)}.map-legend i.caution{background:var(--caution)}.map-legend i.degraded{background:var(--degraded)}.map-legend i.critical{background:var(--critical)}.map-legend i.failed{background:var(--failed)}.map-legend i.na{background:var(--na)}
.island{fill:var(--land);stroke:var(--land-2);stroke-width:.8}
.contour{fill:none;stroke:var(--land-2);stroke-width:.5;stroke-dasharray:1.2 1.2}
.road{fill:none;stroke:var(--road);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.road.crater{stroke-dasharray:2 1.3;stroke-width:.8}
.road.cut{stroke:var(--critical);stroke-dasharray:1 1.6}
.pnode{cursor:pointer}
.pnode .node-ring{fill:var(--panel);stroke:var(--fg-3);stroke-width:.7}
.pnode.sel .node-ring{stroke:var(--accent);stroke-width:1.3}
.pnode .pname{font-family:var(--sans);font-weight:600;font-size:4px;letter-spacing:.02em;fill:var(--fg);text-transform:uppercase}
.pnode .ppop{font-family:var(--mono);font-size:2.6px;fill:var(--fg-3)}
.pnode .bar-bg{fill:var(--bg-2)}
.pnode .iso{fill:none;stroke:var(--critical);stroke-width:.8;stroke-dasharray:1.6 1.1}
.pnode .isolbl{font-family:var(--mono);font-size:2.6px;letter-spacing:.12em;fill:var(--critical);font-weight:600}
.storm .ring{fill:none;stroke:var(--storm);stroke-width:.6;opacity:.75}
.storm .ring.outer{stroke-dasharray:1.5 1.2;opacity:.5}
.storm .fill{fill:var(--storm-soft)}
.storm .eye{fill:var(--panel);stroke:var(--storm);stroke-width:.9}
.storm .arm{fill:none;stroke:var(--storm);stroke-width:.7;opacity:.6}
.storm .cat{font-family:var(--mono);font-size:4.2px;font-weight:600;fill:var(--storm);letter-spacing:.04em}
.storm .catsub{font-family:var(--mono);font-size:2.6px;fill:var(--fg-2)}
.gridline{stroke:var(--sea-2);stroke-width:.3}
.gridlbl{font-family:var(--mono);font-size:2.4px;fill:var(--fg-3)}
.offshore{font-family:var(--mono);font-size:2.8px;fill:var(--fg-2)}
.sel-info{font-family:var(--mono);font-size:11px;color:var(--fg-2)}

/* event feed */
.feed{display:flex;flex-direction:column;gap:0;max-height:640px;overflow-y:auto;overscroll-behavior:contain}
.feed .tickhead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:10px;padding:5px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.feed .tickhead:first-child{border-top:0}
.feed .tickhead b{color:var(--fg);font-weight:600}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.ev .evk{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:84px}
.ev .evp{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);letter-spacing:.06em;text-transform:uppercase}
.ev .evt{min-width:0;color:var(--fg);overflow-wrap:anywhere}
.ev .evt .d{font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.ev .evt .d b{font-weight:600}
.ev .evt .d b.neg{color:var(--neg)}.ev .evt .d b.pos{color:var(--pos)}
.kch{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:2px;border:1px solid transparent;line-height:1.5;white-space:nowrap}
.kch.window{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.kch.degradation{background:var(--degraded-soft);color:var(--degraded)}
.kch.connectivity{background:var(--caution-soft);color:var(--caution)}
.kch.cascade{background:var(--critical-soft);color:var(--critical);border-color:var(--critical)}
.kch.isolation{background:var(--failed-soft);color:var(--failed);border-color:var(--failed)}
.kch.dilemma{background:var(--storm-soft);color:var(--storm);border-color:var(--storm)}
.kch.decision{background:var(--fg);color:var(--bg)}
.kch.consequence{background:var(--degraded-soft);color:var(--degraded);border-color:var(--degraded)}
.kch.directive{background:var(--panel-2);color:var(--fg-2);border-color:var(--line-2)}
.kch.narrative{background:transparent;color:var(--fg-2);border-color:var(--line-2)}
.kch.other{background:transparent;color:var(--fg-3);border-color:var(--line)}
.card{border:1px solid var(--line-2);border-left:3px solid var(--storm);background:var(--panel-2);padding:8px 10px;margin-top:2px}
.card.decision{border-left-color:var(--fg)}
.card .ct{font-weight:600;font-size:15px;line-height:1.2}
.card .cs{color:var(--fg-2);font-size:13.5px;margin-top:3px}
.card .cm{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:11px;color:var(--fg-3);margin-top:6px}
.card .cm b{color:var(--fg-2);font-weight:500}
.card .opt{margin-top:6px;font-size:14px}
.card .opt .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-right:6px}
.card .rat{color:var(--fg-2);font-style:italic;font-size:13.5px;margin-top:3px}
.vals{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.vch{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:2px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.vch.pos{color:var(--pos);border-color:var(--pos);background:var(--ok-soft)}
.vch.neg{color:var(--neg);border-color:var(--neg);background:var(--critical-soft)}
.empty{padding:16px 12px;color:var(--fg-3);font-family:var(--mono);font-size:12px}

/* parish grid */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
@media (max-width:1100px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.pp{cursor:pointer}
.pp.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pp .panel-h h2{letter-spacing:.06em;font-size:15px;color:var(--fg);text-transform:none}
.pp .panel-h{align-items:center}
.pp .hd-r{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.pp .hd-r b{color:var(--fg);font-weight:500}
.isotag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--critical);border:1px solid var(--critical);padding:0 5px;border-radius:2px}
.isotag[hidden]{display:none}
.sysrows{display:grid;grid-template-columns:max-content minmax(0,1fr) 3ch;gap:4px 8px;align-items:center}
.sysrows .sl{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.sysrows .sv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;text-align:right;color:var(--fg-2)}
.bar{position:relative;height:10px;background:var(--bg-2);border:1px solid var(--line);min-width:0}
.bar .f{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ok);transition:width .12s linear,background-color .12s linear}
.bar .tk{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line-2)}
.bar.na{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px);border-style:dashed}
.bar.na .f{display:none}
.st-ok{background:var(--ok)!important}.st-caution{background:var(--caution)!important}.st-degraded{background:var(--degraded)!important}.st-critical{background:var(--critical)!important}.st-failed{background:var(--failed)!important}
.sv.na{color:var(--fg-3)}
.spark{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.spark .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:4px}
.spark svg{display:block;width:100%;height:44px;max-width:100%}
.spark .sl{fill:none;stroke:var(--fg-2);stroke-width:1.3;vector-effect:non-scaling-stroke}
.spark .sa{fill:var(--accent-soft);stroke:none}
.spark .cur{stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.spark .thr{stroke:var(--line-2);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 3}
.spark .cp{fill:var(--accent)}
.morale{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.morale .bar{flex:1 1 auto;height:6px}
.morale .bar .f{background:var(--accent)}

/* debrief */
.debrief{margin-bottom:12px}
.dgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
@media (max-width:900px){.dgrid{grid-template-columns:1fr}}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:480px){.totals{grid-template-columns:1fr 1fr}}
.tot{border:1px solid var(--line);padding:8px 10px;background:var(--panel-2)}
.tot .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.tot .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1;margin-top:3px}
.tblwrap{overflow-x:auto;max-width:100%}
